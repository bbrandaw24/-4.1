services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_agriculture}
      MYSQL_USER: ${MYSQL_USER:-agri_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "127.0.0.1:${MYSQL_PORT_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT_HOST:-1883}:1883"
      - "127.0.0.1:${MQTT_WS_PORT_HOST:-9001}:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  simulator:
    build: ./services/simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      # Multi-plot simulation (apple / pear / orange orchards). Override with a
      # JSON list of profiles via SIM_DEVICES if different plots are needed.
      SIM_DEVICES: ${SIM_DEVICES:-}
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
      # Day 16: simulator bootstraps 5 sensors per plot through the API.
      API_UPSTREAM: http://api:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SIM_KEEP_LEGACY_PAYLOADS: ${SIM_KEEP_LEGACY_PAYLOADS:-true}
    depends_on:
      mosquitto:
        condition: service_started

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_agriculture}
      MYSQL_USER: ${MYSQL_USER:-agri_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      AI_BASE_URL: http://ai:8001
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      DB_PATH: /data/users.db
      AUTH_SECRET: ${AUTH_SECRET:-change-me-auth-secret}
      AUTH_TOKEN_MAX_AGE: ${AUTH_TOKEN_MAX_AGE:-43200}
      AUTH_SEED_DEMO: ${AUTH_SEED_DEMO:-1}
      # Luna mode for the irrigation advisor (OpenAI-compatible). Thinking effort
      # is fixed at medium server-side; key lives in .env, never committed.
      # 2026-08-28: default backend switched to 智谱 GLM (open.bigmodel.cn).
      LUNA_API_KEY: ${LUNA_API_KEY:-}
      LUNA_BASE_URL: ${LUNA_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LUNA_MODEL: ${LUNA_MODEL:-glm-5.3-flash}
      LUNA_REASONING_EFFORT: ${LUNA_REASONING_EFFORT:-medium}
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started

  ai:
    build: ./services/ai
    restart: unless-stopped
    environment:
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-strawberry-resnet50-tl-v1}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.60}
      AI_MODEL_PATH: /models/strawberry_resnet50.ts
      AI_LABELS_PATH: /models/classes.json
    ports:
      - "${AI_PORT:-8001}:8001"
    volumes:
      # 训练产物挂载：训练后模型直接进入容器，无需重建镜像
      - ./services/ai/models:/models

  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
      AI_UPSTREAM: http://ai:8001
      GATEWAY_PORT: 8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
      - ai

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
